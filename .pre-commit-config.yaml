# Install once per clone: brew install gitleaks pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Uses the locally installed gitleaks binary; CI runs the same version in a container.
      - id: gitleaks-system
        # gitleaks scans the staged diff itself and rejects file names as arguments.
        pass_filenames: false
