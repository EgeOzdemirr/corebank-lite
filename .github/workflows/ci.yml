name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  build:
    name: Build, quality gates and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and static analysis (Checkstyle, PMD, CPD, SpotBugs)
        run: ./mvnw -B -ntp -DskipTests verify

      - name: Unit tests, Testcontainers integration tests and JaCoCo coverage gate
        run: ./mvnw -B -ntp verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore
