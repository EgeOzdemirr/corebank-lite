# Local development infrastructure. Values come from .env (copy .env.example); nothing secret lives here.
name: corebank-lite

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${ACCOUNT_DB_NAME:?set ACCOUNT_DB_NAME in .env}
      POSTGRES_USER: ${ACCOUNT_DB_USERNAME:?set ACCOUNT_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # Single-node KRaft cluster: the same process is broker and controller, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly by kafka-init with their partition count and retention.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Creates the versioned event topics. Retention is kept for days so that consumers added later (aml-monitor)
  # can replay history with their own consumer group; the partition key is the account id.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TOPICS: banking.accounts.opened.v1 banking.transfers.approved.v1 banking.transfers.posted.v1
      PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-604800000}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in $$TOPICS; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions "$$PARTITIONS" --replication-factor 1 \
            --config retention.ms="$$RETENTION_MS"
        done
    restart: "no"

volumes:
  postgres-data:
