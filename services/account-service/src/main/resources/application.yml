spring:
  application:
    name: account-service
  config:
    # Local runs read secrets from the repository's .env (never committed); containers get real env variables.
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/corebank_account}
    username: ${ACCOUNT_DB_USERNAME}
    password: ${ACCOUNT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Deterministic flush order (by primary key) keeps row-lock order stable across concurrent postings.
        order_updates: true
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  grpc:
    server:
      # Internal API for transfer-service (ADR-0004); not routed through the gateway.
      port: ${ACCOUNT_SERVICE_GRPC_PORT:9090}
      # Reflection lists every service and message to anyone who can reach the port; only the local profile needs it.
      reflection:
        enabled: false

server:
  port: ${ACCOUNT_SERVICE_PORT:8080}

corebank:
  account:
    iban:
      synthetic-bank-code: ${COREBANK_SYNTHETIC_BANK_CODE:99999}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
